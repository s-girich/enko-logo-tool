<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENKO Letter Prism</title>
    <link rel="stylesheet" href="src/styles.css?v=20260803" />
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-label="Предпросмотр знака">
        <div class="preview-shell">
          <svg
            id="logoSvg"
            class="logo-svg"
            viewBox="0 0 1000 1000"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Сгенерированный знак"
          ></svg>
        </div>
      </section>

      <aside class="panel" aria-label="Параметры генератора">
        <div class="brand-mark">ЭНКО. prism</div>

        <label class="field">
          <span>Буква</span>
          <input id="letterInput" type="text" maxlength="1" value="Э" autocomplete="off" />
        </label>

        <label class="field">
          <span>Шрифт</span>
          <select id="fontSelect">
            <option value="Arial Black, Arial, sans-serif">Плотный гротеск</option>
            <option value="Arial Narrow, Arial, sans-serif">Узкий гротеск</option>
            <option value="Georgia, serif">Контрастная антиква</option>
            <option value="system-ui, sans-serif">Системный гротеск</option>
          </select>
        </label>

        <label class="field">
          <span>Сетка</span>
          <select id="templateSelect">
            <option value="square-kaleidoscope">Квадратный калейдоскоп</option>
            <option value="radial-emblem">Радиальная эмблема</option>
            <option value="modular-crest" selected>Модульный герб</option>
            <option value="radial-fingerprint">Радиальный отпечаток</option>
            <option value="morph-kaleidoscope">Морфокалейдоскоп</option>
            <option value="crest-mandala">Герб-мандала</option>
            <option value="counterform-kaleidoscope">Контрформный калейдоскоп</option>
            <option value="orbital-grammar">Орбитальная грамматика</option>
            <option value="topological-crest">Топологический герб</option>
            <option value="tectonics">Тектоника</option>
            <option value="skeleton">Скелет</option>
            <option value="packing">Упаковка</option>
            <option value="armature">Арматура</option>
            <option value="brick">Кирпичная</option>
            <option value="galaxy">Галактика</option>
            <option value="sunburst">Лучевая</option>
            <option value="mixed">Смешанная</option>
            <option value="barcode">Штриховая</option>
            <option value="pulse">Пульс</option>
            <option value="burst">Из буквы</option>
            <option value="rosette">Розетка</option>
          </select>
        </label>

        <label class="field" id="symmetryField">
          <span>Симметрия</span>
          <select id="symmetrySelect">
            <option value="4">Четыре отражения</option>
            <option value="8" selected>Восемь отражений</option>
          </select>
        </label>

        <div class="control-grid">
          <label class="field">
            <span id="sectorsLabel">Модули по стороне</span>
            <input id="sectorsInput" type="number" step="1" value="10" />
          </label>

          <label class="field">
            <span>Масштаб</span>
            <input id="scaleInput" type="number" step="any" value="62" />
          </label>

          <label class="field">
            <span>Смещение</span>
            <input id="offsetInput" type="number" step="any" value="104" />
          </label>

          <label class="field" id="densityField">
            <span id="densityLabel">Ряды</span>
            <input id="densityInput" type="number" step="1" value="3" />
          </label>

          <label class="field" id="rowWeightField">
            <span id="rowWeightLabel">Толщина рядов</span>
            <input id="rowWeightInput" type="number" step="any" value="86" />
          </label>

          <label class="field">
            <span>Промежутки</span>
            <input id="cellGapInput" type="number" step="any" value="12" />
          </label>

          <label class="field">
            <span>Порог заливки</span>
            <input id="fillThresholdInput" type="number" step="any" value="14" />
          </label>

          <label class="field">
            <span id="ringTwistLabel">Поворот семени</span>
            <input id="ringTwistInput" type="number" step="any" value="12" />
          </label>

        </div>

        <div class="metric">
          <span id="metricLabel">Модули: сетка / заполнено</span>
          <output id="cellCountValue">100 / 24</output>
        </div>

        <label class="toggle">
          <input id="gridToggle" type="checkbox" />
          <span>Показывать сетку</span>
        </label>

        <label class="toggle">
          <input id="monochromeToggle" type="checkbox" />
          <span>Монохром</span>
        </label>

        <fieldset class="swatches">
          <legend>Цвет</legend>
          <button class="swatch is-active" data-palette="navy" title="Синий ЭНКО"></button>
          <button class="swatch swatch-dark" data-palette="ink" title="Черный"></button>
          <button class="swatch swatch-light" data-palette="paper" title="Светлый"></button>
        </fieldset>

        <div class="actions">
          <button id="randomButton" type="button">Вариант</button>
          <button id="downloadSvgButton" type="button">SVG</button>
          <button id="downloadPngButton" type="button">PNG</button>
          <button id="downloadJsonButton" type="button">JSON</button>
        </div>
      </aside>
    </main>

    <script src="src/app.js"></script>
  </body>
</html>
